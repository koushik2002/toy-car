<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080f18" />
    <meta
      name="description"
      content="Tiny Kars is building a bigger, faster and cooler collecting experience."
    />
    <title>Tiny Kars — Under Construction</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #080f18;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        overflow-x: hidden;
        isolation: isolate;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: -32px;
        content: '';
        background:
          linear-gradient(#07111c99, #07111c99),
          url('./tiny-kars-under-construction.jpeg') center / cover no-repeat;
        filter: blur(18px);
        transform: scale(1.05);
      }

      .maintenance-artwork {
        display: block;
        width: 100%;
        height: 100svh;
        object-fit: contain;
        object-position: center;
      }

      @media (max-width: 720px) {
        .maintenance-artwork {
          padding: 12px 0;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="maintenance-artwork"
      src="./tiny-kars-under-construction.jpeg"
      alt="Tiny Kars website under construction. We are building a bigger, faster and cooler Tiny Kars experience. Stay tuned."
    />
  </body>
</html>
