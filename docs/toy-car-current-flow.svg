<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1150" viewBox="0 0 1920 1150" role="img" aria-label="Tiny Kars current sales and billing flow">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b111a"/><stop offset="1" stop-color="#121b28"/></linearGradient>
  <linearGradient id="rule"><stop stop-color="#ef4b55"/><stop offset="1" stop-color="#f9c65d"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05080e" flood-opacity=".5"/></filter>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef4b55"/></marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9c65d"/></marker>
</defs>
<style>
  .eyebrow{font:700 22px Arial,sans-serif;letter-spacing:5px;fill:#f9c65d}
  .headline{font:800 78px Arial,sans-serif;letter-spacing:-2px;fill:#fff}
  .subtitle{font:400 29px Arial,sans-serif;fill:#b7c2d2}
  .num{font:800 23px Arial,sans-serif;fill:#111925}
  .kicker{font:700 20px Arial,sans-serif;letter-spacing:2px;fill:#b8c8d6}
  .card-title{font:800 29px Arial,sans-serif;fill:#fff}
  .body{font:400 22px Arial,sans-serif;fill:#d4deea}
  .note{font:700 19px Arial,sans-serif;fill:#f9c65d}
  .footer-title{font:800 25px Arial,sans-serif;fill:#fff}
  .footer-body{font:400 21px Arial,sans-serif;fill:#c4d0dd}
</style>
<rect width="1920" height="1150" fill="url(#bg)"/>
<path d="M0 20L1920 20M0 1120L1920 1120" stroke="#253649" stroke-width="2"/>
<path d="M70 70H420" stroke="url(#rule)" stroke-width="8" stroke-linecap="round"/>
<text x="70" y="115" class="eyebrow">TINY KARS  /  CURRENT PROTOTYPE</text>
<text x="70" y="203" class="headline">WhatsApp to billing flow</text>
<text x="72" y="248" class="subtitle">What the GitHub Pages demo actually saves, sends and deducts</text>
<g filter="url(#shadow)">
    <rect x="70" y="320" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="70" y="320" width="390" height="7" rx="3" fill="#ef4b55"/>
    <circle cx="114" cy="369" r="24" fill="#ef4b55"/>
    <text x="114" y="377" text-anchor="middle" class="num">01</text>
    <text x="152" y="363" class="kicker">COLLECTOR</text>
    <text x="100" y="421" class="card-title">Browse &amp; select</text>
    <text x="100" y="460" class="body">Explore catalogue products</text><text x="100" y="488" class="body">and add models to the cart.</text>
    <text x="100" y="532" class="note">Products live in this browser.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="535" y="320" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="535" y="320" width="390" height="7" rx="3" fill="#ef4b55"/>
    <circle cx="579" cy="369" r="24" fill="#ef4b55"/>
    <text x="579" y="377" text-anchor="middle" class="num">02</text>
    <text x="617" y="363" class="kicker">CHECKOUT</text>
    <text x="565" y="421" class="card-title">Save local request</text>
    <text x="565" y="460" class="body">Validate stock and address.</text><text x="565" y="488" class="body">Deduct demo stock now.</text>
    <text x="565" y="532" class="note">This happens before WhatsApp Send.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="1000" y="320" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="1000" y="320" width="390" height="7" rx="3" fill="#ef4b55"/>
    <circle cx="1044" cy="369" r="24" fill="#ef4b55"/>
    <text x="1044" y="377" text-anchor="middle" class="num">03</text>
    <text x="1082" y="363" class="kicker">WHATSAPP</text>
    <text x="1030" y="421" class="card-title">Customer taps Send</text>
    <text x="1030" y="460" class="body">A prefilled message opens.</text><text x="1030" y="488" class="body">Customer sends it manually.</text>
    <text x="1030" y="532" class="note">Opening a link does not send it.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="1465" y="320" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="1465" y="320" width="390" height="7" rx="3" fill="#ef4b55"/>
    <circle cx="1509" cy="369" r="24" fill="#ef4b55"/>
    <text x="1509" y="377" text-anchor="middle" class="num">04</text>
    <text x="1547" y="363" class="kicker">SHOP CHAT</text>
    <text x="1495" y="421" class="card-title">Agree the sale</text>
    <text x="1495" y="460" class="body">Shop confirms availability,</text><text x="1495" y="488" class="body">delivery and payment in chat.</text>
    <text x="1495" y="532" class="note">No payment gateway.</text>
  </g>
<path d="M460 438H515" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/><path d="M925 438H980" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/><path d="M1390 438H1445" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/>
<g filter="url(#shadow)">
    <rect x="70" y="690" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="70" y="690" width="390" height="7" rx="3" fill="#66c7df"/>
    <circle cx="114" cy="739" r="24" fill="#66c7df"/>
    <text x="114" y="747" text-anchor="middle" class="num">A</text>
    <text x="152" y="733" class="kicker">ADMIN CATALOGUE</text>
    <text x="100" y="791" class="card-title">Add or import products</text>
    <text x="100" y="830" class="body">Edit items or import CSV.</text><text x="100" y="858" class="body">Changes stay in local storage.</text>
    <text x="100" y="902" class="note">No shared database.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="535" y="690" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="535" y="690" width="390" height="7" rx="3" fill="#66c7df"/>
    <circle cx="579" cy="739" r="24" fill="#66c7df"/>
    <text x="579" y="747" text-anchor="middle" class="num">B</text>
    <text x="617" y="733" class="kicker">STOCK + TALLY</text>
    <text x="565" y="791" class="card-title">Demo stock &amp; jobs</text>
    <text x="565" y="830" class="body">Checkout or bill queues</text><text x="565" y="858" class="body">simulated sales/stock jobs.</text>
    <text x="565" y="902" class="note">No real Tally connection.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="1000" y="690" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="1000" y="690" width="390" height="7" rx="3" fill="#66c7df"/>
    <circle cx="1044" cy="739" r="24" fill="#66c7df"/>
    <text x="1044" y="747" text-anchor="middle" class="num">C</text>
    <text x="1082" y="733" class="kicker">REQUEST BILLING</text>
    <text x="1030" y="791" class="card-title">Generate saved bill</text>
    <text x="1030" y="830" class="body">Admin opens the request,</text><text x="1030" y="858" class="body">then prints or saves PDF.</text>
    <text x="1030" y="902" class="note">No second stock deduction.</text>
  </g>
<g filter="url(#shadow)">
    <rect x="1465" y="690" width="390" height="235" rx="22" fill="#18212d" stroke="#374451" stroke-width="2"/>
    <rect x="1465" y="690" width="390" height="7" rx="3" fill="#f9c65d"/>
    <circle cx="1509" cy="739" r="24" fill="#f9c65d"/>
    <text x="1509" y="747" text-anchor="middle" class="num">D</text>
    <text x="1547" y="733" class="kicker">SEPARATE PATH</text>
    <text x="1495" y="791" class="card-title">Standalone bill</text>
    <text x="1495" y="830" class="body">Select catalogue models.</text><text x="1495" y="858" class="body">Save bill + deduct stock.</text>
    <text x="1495" y="902" class="note">Rejects missing or insufficient stock.</text>
  </g>
<path d="M265 690V575" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/><path d="M730 555V670" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/><path d="M1660 555V620H1195V670" fill="none" stroke="#ef4b55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrowRed)"/>
<path d="M1660 925V962H730V938" fill="none" stroke="#f9c65d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" marker-end="url(#arrowAmber)"/>
<rect x="70" y="1000" width="1780" height="96" rx="18" fill="#202c39" stroke="#405061"/>
<circle cx="112" cy="1048" r="16" fill="#f9c65d"/>
<text x="148" y="1041" class="footer-title">Browser-only demo</text>
<text x="148" y="1073" class="footer-body">Requests, bills and stock are not shared across devices. No sales-report download or customer shipment tracking.</text>
</svg>