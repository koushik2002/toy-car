name: Production API checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tinykars_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tinykars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinykars_test -d tinykars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tinykars_test:test_password@localhost:5432/tinykars_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:server
      - run: npm test
      - run: npm run build
